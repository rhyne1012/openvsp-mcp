[project]
name = "openvsp-mcp"
version = "0.6.0"
description = "Maintained fork of Three-Little-Birds/openvsp-mcp with OpenVSP geometry automation and durable parallel VSPAERO analysis"
authors = [{ name = "OpenVSP MCP Maintainers" }]
maintainers = [{ name = "rhyne1012" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.5,<5",
    "mcp>=1.20,<2",
    "fastapi>=0.121,<1.0",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "httpx>=0.28",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/rhyne1012/openvsp-mcp"
Repository = "https://github.com/rhyne1012/openvsp-mcp"
Issues = "https://github.com/rhyne1012/openvsp-mcp/issues"
Upstream = "https://github.com/Three-Little-Birds/openvsp-mcp"

[project.scripts]
openvsp-mcp = "openvsp_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openvsp_mcp = ["data/*.vsp3"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
